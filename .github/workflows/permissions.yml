name: Installation permissions

# Whether the owner's installations of SymphonyBoard have accepted every
# permission the App asks for (scripts/permissions.py). GitHub gives an
# installation a permission added to the App later only once someone
# accepts it on the installation's page, and the Share tab and every
# copy's Settings workflow need Administration, so this says, from
# GitHub's own answers, which installation is short and where to accept.
# It writes nothing. The run ends red while an installation of the
# owner's is short, so the list of runs shows it; another account's
# installation is counted, never named. It runs by hand, once a week, and
# on a pull request that changes it, which on this private repository
# has the App's key.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
  pull_request:
    paths:
      - scripts/permissions.py
      - .github/workflows/permissions.yml

permissions:
  contents: read

jobs:
  read:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read every permission the owner's installations hold
        env:
          SDLC_APP_ID: ${{ vars.SDLC_APP_ID }}
          SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          # the organization and its owner's own account, where an installation lends tokens too
          SYMPHONY_OWNER_ACCOUNTS: ${{ github.repository_owner }} Gregory-Schwing-MD-PhD ${{ vars.SYMPHONY_OWNER_ACCOUNTS }}
        run: |
          status=0
          python3 scripts/permissions.py > "$RUNNER_TEMP/report.txt" || status=$?
          cat "$RUNNER_TEMP/report.txt"
          { echo '```'; cat "$RUNNER_TEMP/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
